<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyHub - Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Fraunces:ital,wght@0,300;0,600;1,300&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f3f1ec;--ink:#1b1b1b;--accent:#e4572e}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Bricolage Grotesque',sans-serif;background:var(--bg);color:var(--ink)}
  header{padding:18px 32px;display:flex;align-items:center;gap:28px;border-bottom:2px solid var(--ink)}
  header h1{margin:0;font-family:'Fraunces',serif;font-weight:600;font-size:26px}
  nav button{background:none;border:0;font:600 15px 'Bricolage Grotesque';padding:8px 12px;cursor:pointer;border-radius:999px}
  nav button.active,nav button:hover{background:var(--ink);color:#fff}
  main{max-width:880px;margin:28px auto;padding:0 18px}
  .card{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:5px 5px 0 var(--ink)}
  .card h2{font-family:'Fraunces',serif;margin-top:0}
  .tab{display:none}.tab.active{display:block}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:2px solid var(--ink);border-radius:10px;background:#fff;cursor:pointer;font:500 15px 'Bricolage Grotesque'}
  .opt:hover{background:#ffe9e2}.opt.good{background:#cdeccf}.opt.bad{background:#f7cfcf}
  .flash{height:140px;display:flex;align-items:center;justify-content:center;font:600 26px 'Fraunces',serif;border:2px dashed var(--ink);border-radius:12px;cursor:pointer;user-select:none}
  .btn{padding:9px 16px;border:2px solid var(--ink);background:var(--accent);color:#fff;border-radius:999px;cursor:pointer;font:600 14px 'Bricolage Grotesque'}
</style>
</head>
<body>
<header>
  <h1>StudyHub</h1>
  <nav id="nav">
    <button data-t="home" class="active">Home</button>
    <button data-t="quiz">Math Quiz</button>
    <button data-t="cards">Flashcards</button>
  </nav>
</header>
<main>
  <section id="home" class="tab active">
    <div class="card"><h2>Welcome back</h2><p>Practice math or review vocab with flashcards.</p></div>
    <div class="card"><h2>Did you know?</h2><p id="fact"></p></div>
  </section>
  <section id="quiz" class="tab"><div class="card"><h2>Math Quiz</h2><div id="q"></div><p>Score: <b id="score">0</b></p><button class="btn" id="nextq">Next question</button></div></section>
  <section id="cards" class="tab"><div class="card"><h2>Vocab Flashcards</h2><div class="flash" id="flash"></div><p>Click the card to flip.</p><button class="btn" id="nextc">Next card</button></div></section>
</main>

<!-- ============ OS LAYER (Ctrl+Y) ============ -->
<style>
  #os{position:fixed;inset:0;z-index:9999;display:none;overflow:hidden;color:#eceef3;
    font-family:'Bricolage Grotesque',sans-serif;user-select:none;
    background:radial-gradient(1200px 700px at 20% 10%,#1b1740 0%,transparent 60%),
               radial-gradient(900px 600px at 85% 90%,#2a0f2f 0%,transparent 60%),#07070b}
  #os.open{display:block}
  #menubar{position:absolute;top:0;left:0;right:0;height:30px;background:rgba(10,10,16,.65);backdrop-filter:blur(18px);
    display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:13px;font-weight:600;z-index:5}
  #menubar span{margin-right:16px;opacity:.9}
  #mbclock{font-family:'JetBrains Mono',monospace;font-weight:400}
  #deskclock{position:absolute;top:70px;right:50px;text-align:right;pointer-events:none}
  #dtime{font-family:'Fraunces',serif;font-weight:300;font-size:92px;line-height:1;letter-spacing:-2px}
  #ddate{font-family:'Fraunces',serif;font-style:italic;font-size:22px;opacity:.7;margin-top:4px}
  #dock{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:12px;padding:10px 14px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(22px);border-radius:22px;z-index:5}
  .dk{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;
    transition:transform .15s;position:relative}
  .dk:hover{transform:translateY(-10px) scale(1.2)}
  .dk::after{content:attr(data-n);position:absolute;top:-30px;background:#000c;padding:3px 9px;border-radius:7px;font-size:12px;opacity:0;pointer-events:none;white-space:nowrap}
  .dk:hover::after{opacity:1}
  .dk.run::before{content:"";position:absolute;bottom:-7px;width:5px;height:5px;border-radius:50%;background:#fff}
  .win{position:absolute;background:#12121a;border:1px solid rgba(255,255,255,.14);border-radius:14px;box-shadow:0 30px 80px #000c;
    display:flex;flex-direction:column;overflow:hidden;min-width:300px;min-height:200px}
  .rz{position:absolute;right:0;bottom:0;width:10px;height:10px;cursor:nwse-resize;z-index:3}
  #float{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 22s ease-in-out infinite alternate}
  .star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 4s ease-in-out infinite}
  .shape{position:absolute;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);backdrop-filter:blur(6px);animation:fl 14s ease-in-out infinite}
  @keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(120px,-80px) scale(1.25)}}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  @keyframes fl{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-40px) rotate(25deg)}}
  #dwx{font-family:'JetBrains Mono',monospace;font-size:15px;opacity:.85;margin-top:10px}
  .wt{height:36px;background:#1b1b26;display:flex;align-items:center;padding:0 12px;gap:8px;cursor:move;flex-shrink:0}
  .wt i{width:12px;height:12px;border-radius:50%;display:inline-block;cursor:pointer}
  .wt .t{margin-left:10px;font-size:13px;font-weight:600;opacity:.8}
  .wb{flex:1;overflow:auto;position:relative;user-select:text}
  .win iframe{width:100%;height:100%;border:0;background:#000}
  /* AI app */
  .chat{display:flex;flex-direction:column;height:100%}
  .chat .top{padding:8px 12px;border-bottom:1px solid #ffffff14;display:flex;gap:8px;align-items:center;font-size:12px}
  .chat select{background:#1f1f2b;color:#fff;border:1px solid #ffffff22;border-radius:6px;padding:4px;font:12px 'JetBrains Mono',monospace}
  .msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  .m{padding:10px 13px;border-radius:14px;max-width:88%;white-space:pre-wrap;line-height:1.45;font-size:14px}
  .m.u{align-self:flex-end;background:linear-gradient(135deg,#6a4bff,#b44bff)}
  .m.a{align-self:flex-start;background:#22222f}
  .m.e{align-self:flex-start;background:#3a1620;color:#ffb3c0;font-family:'JetBrains Mono',monospace;font-size:12px}
  .cform{display:flex;gap:8px;padding:10px 18px 18px 10px;border-top:1px solid #ffffff14}
  .chat input{flex:1;background:#1f1f2b;border:1px solid #ffffff22;border-radius:10px;color:#fff;padding:10px;font:14px 'Bricolage Grotesque'}
  .chat button,.obtn{background:#6a4bff;border:0;color:#fff;border-radius:10px;padding:0 16px;font:600 14px 'Bricolage Grotesque';cursor:pointer;padding:8px 14px}
  .ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
  .gtile{background:#1f1f2b;border:1px solid #ffffff14;border-radius:14px;padding:18px 8px;text-align:center;cursor:pointer;font-weight:600;transition:transform .15s,background .15s}
  .gtile:hover{transform:translateY(-4px);background:#2a2a3d}
  .pad{padding:16px}
  .pad input,.pad textarea{width:100%;background:#1f1f2b;border:1px solid #ffffff22;border-radius:8px;color:#fff;padding:9px;font:13px 'JetBrains Mono',monospace}
  .gm{display:grid;grid-template-columns:repeat(3,70px);gap:6px;justify-content:center;margin:12px 0}
  .gm div{height:70px;background:#1f1f2b;border-radius:10px;display:flex;align-items:center;justify-content:center;font:600 34px 'Fraunces',serif;cursor:pointer}
  .calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px}
  .calc .disp{grid-column:span 4;background:#000;border-radius:8px;padding:12px;text-align:right;font:24px 'JetBrains Mono',monospace;min-height:50px}
  .calc button{background:#262636;border:0;color:#fff;border-radius:8px;padding:14px;font:18px 'JetBrains Mono',monospace;cursor:pointer}
  .calc button.op{background:#6a4bff}
</style>

<script>
/* ===== CONFIG ===== */
// WARNING: this key is visible to anyone who can open this file. Rotate it.
const API_KEY = "AQ.Ab8RN6KG3csuU7nO2YmZ2hwtX3RO_IoPzjudZNPhCqqWuQaoVw";
const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/";
const MODELS  = ["gemini-3.8-flash"];

/* ===== School site ===== */
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#nav button,.tab").forEach(e=>e.classList.remove("active"));
  b.classList.add("active");document.getElementById(b.dataset.t).classList.add("active");
});
const facts=["Honey never spoils.","A day on Venus is longer than its year.","Octopuses have three hearts.","Light takes about 8 minutes to reach Earth from the Sun."];
fact.textContent=facts[Math.floor(Math.random()*facts.length)];
let score=0,ans=0;
function newQ(){
  const a=1+Math.floor(Math.random()*12),b=1+Math.floor(Math.random()*12);ans=a*b;
  const o=new Set([ans]);while(o.size<4)o.add(ans+Math.floor(Math.random()*21)-10);
  q.innerHTML=`<h3>${a} × ${b} = ?</h3>`;
  [...o].sort(()=>Math.random()-.5).forEach(v=>{
    const bt=document.createElement("button");bt.className="opt";bt.textContent=v;
    bt.onclick=()=>{if(v===ans){bt.classList.add("good");score++}else bt.classList.add("bad");document.getElementById("score").textContent=score;q.querySelectorAll(".opt").forEach(x=>x.onclick=null)};
    q.appendChild(bt);
  });
}
nextq.onclick=newQ;newQ();
const deck=[["Photosynthesis","How plants turn light into food"],["Democracy","Government by the people"],["Metaphor","Comparing without 'like' or 'as'"],["Erosion","Wearing away of land by wind/water"]];
let ci=0,fr=true;const showC=()=>flash.textContent=fr?deck[ci][0]:deck[ci][1];
flash.onclick=()=>{fr=!fr;showC()};nextc.onclick=()=>{ci=(ci+1)%deck.length;fr=true;showC()};showC();

/* ===== OS ===== */
const os=document.getElementById("os");
addEventListener("keydown",e=>{
  if(e.ctrlKey&&e.key.toLowerCase()==="y"){e.preventDefault();os.classList.toggle("open")}
});
function tick(){
  const d=new Date();
  dtime.textContent=d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}).replace(/ ?[AP]M/,"");
  ddate.textContent=d.toLocaleDateString([], {weekday:"long",month:"long",day:"numeric"});
  mbclock.textContent=d.toLocaleString([], {weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
}
tick();setInterval(tick,1000);

/* floating background */
(function(){
  const f=document.getElementById("float"),R=(a,b)=>a+Math.random()*(b-a);
  [["#5b3cff",520,"8%","10%"],["#ff3c8e",460,"70%","55%"],["#00c2ff",400,"40%","75%"]].forEach(([c,s,x,y],i)=>{
    const d=document.createElement("div");d.className="blob";d.style.cssText=`background:${c};width:${s}px;height:${s}px;left:${x};top:${y};animation-delay:${-i*7}s`;f.appendChild(d)});
  for(let i=0;i<70;i++){const s=document.createElement("div");s.className="star";s.style.cssText=`left:${R(0,100)}%;top:${R(0,100)}%;animation-delay:${R(0,4)}s;animation-duration:${R(2,6)}s`;f.appendChild(s)}
  for(let i=0;i<9;i++){const s=document.createElement("div");s.className="shape";const z=R(40,110);
    s.style.cssText=`width:${z}px;height:${z}px;left:${R(0,92)}%;top:${R(10,80)}%;border-radius:${i%2?"50%":"18px"};animation-delay:${-R(0,14)}s;animation-duration:${R(10,20)}s`;f.appendChild(s)}
})();

/* weather (Open-Meteo, no key) */
function loadWx(lat,lon){
  fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`)
    .then(r=>r.json()).then(j=>{
      const c=j.current.weather_code,ic=c===0?"☀":c<4?"⛅":c<50?"🌫":c<70?"🌧":c<80?"❄":"⛈";
      dwx.textContent=`${ic} ${Math.round(j.current.temperature_2m)}°F outside`;
    }).catch(()=>dwx.textContent="☁ weather unavailable");
}
navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>loadWx(p.coords.latitude,p.coords.longitude),()=>loadWx(42.49,-83.1),{timeout:4000}):loadWx(42.49,-83.1);

let z=10,openApps={};
function openWin(id,title,w,h,build){
  if(openApps[id]){openApps[id].style.zIndex=++z;return}
  const win=document.createElement("div");win.className="win";
  win.style.cssText=`width:${w}px;height:${h}px;left:${80+Object.keys(openApps).length*34}px;top:${60+Object.keys(openApps).length*30}px;z-index:${++z}`;
  win.innerHTML=`<div class="wt"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span class="t">${title}</span></div><div class="wb"></div>`;
  const body=win.querySelector(".wb");build(body,win);
  const rz=document.createElement("div");rz.className="rz";win.appendChild(rz);
  rz.onmousedown=e=>{e.preventDefault();e.stopPropagation();
    const sw=win.offsetWidth,sh=win.offsetHeight,sx=e.clientX,sy=e.clientY;
    const mv=ev=>{win.style.width=Math.max(300,sw+ev.clientX-sx)+"px";win.style.height=Math.max(200,sh+ev.clientY-sy)+"px"};
    const up=()=>{removeEventListener("mousemove",mv);removeEventListener("mouseup",up)};
    addEventListener("mousemove",mv);addEventListener("mouseup",up)};
  wins.appendChild(win);openApps[id]=win;
  document.querySelector(`.dk[data-id="${id}"]`)?.classList.add("run");mbapp.textContent=title;
  win.querySelector("i").onclick=()=>{win.remove();delete openApps[id];win.cleanup&&win.cleanup();document.querySelector(`.dk[data-id="${id}"]`)?.classList.remove("run")};
  win.onmousedown=()=>{win.style.zIndex=++z;mbapp.textContent=title};
  const bar=win.querySelector(".wt");
  bar.onmousedown=e=>{
    if(e.target.tagName==="I")return;
    const sx=e.clientX-win.offsetLeft,sy=e.clientY-win.offsetTop;
    const mv=ev=>{win.style.left=ev.clientX-sx+"px";win.style.top=Math.max(30,ev.clientY-sy)+"px"};
    const up=()=>{removeEventListener("mousemove",mv);removeEventListener("mouseup",up)};
    addEventListener("mousemove",mv);addEventListener("mouseup",up);
  };
}

/* --- AI Assistant --- */
function appAI(body){
  body.innerHTML=`<div class="chat"><div class="top">Model <select>${MODELS.map(m=>`<option>${m}</option>`).join("")}</select><span style="margin-left:auto;opacity:.4">chat v3</span></div><div class="msgs"></div><div class="cform"><input class="cin" placeholder="Ask anything..." autocomplete="off"><button type="button" class="csend">Send</button></div></div>`;
  const msgs=body.querySelector(".msgs"),inp=body.querySelector(".cin"),sel=body.querySelector("select"),btn=body.querySelector(".csend");
  const hist=[{role:"system",content:"You are a friendly, concise assistant inside a desktop OS."}];
  const add=(c,t)=>{const d=document.createElement("div");d.className="m "+c;d.textContent=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d};
  add("a","Hi! I'm your assistant. What do you need?");
  let busy=false;
  async function send(){
    const t=inp.value.trim();if(!t||busy)return;
    busy=true;inp.value="";add("u",t);hist.push({role:"user",content:t});const box=add("a","…");
    try{
      const contents=hist.filter(m=>m.role!=="system").map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]}));
      const r=await fetch(API_URL+sel.value+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":API_KEY},body:JSON.stringify({system_instruction:{parts:[{text:hist[0].content}]},contents})});
      const txt=await r.text();let j=null;try{j=JSON.parse(txt)}catch(_){}
      if(!r.ok)throw new Error("HTTP "+r.status+" "+((j&&j.error&&j.error.message)||txt.slice(0,300)));
      const c=j.candidates&&j.candidates[0];
      const out=(c&&c.content&&c.content.parts||[]).map(p=>p.text||"").join("")||("(no reply: "+((c&&c.finishReason)||(j.promptFeedback&&j.promptFeedback.blockReason)||"empty")+")");
      box.textContent=out;hist.push({role:"assistant",content:out});
    }catch(err){box.className="m e";box.textContent=(String(err.message)==="Failed to fetch"?"Network/CORS error: the browser could not reach the API (a school filter may be blocking it). Try another model.":err.message);hist.pop()}
    busy=false;msgs.scrollTop=msgs.scrollHeight;
  }
  ["click","pointerup","touchend"].forEach(ev=>btn.addEventListener(ev,e=>{e.stopPropagation();e.preventDefault();send()}));
  window.onerror=(m)=>{add("e","JS error: "+m)};
  inp.addEventListener("keydown",e=>{e.stopPropagation();if(e.key==="Enter"){e.preventDefault();send()}});
  inp.addEventListener("keyup",e=>e.stopPropagation());
  setTimeout(()=>inp.focus(),50);
}

/* --- Snake --- */
function appSnake(body,win){
  body.innerHTML='<canvas width="400" height="400" style="display:block;margin:10px auto;background:#07070b;border-radius:10px"></canvas><p style="text-align:center;opacity:.6">Arrow keys</p>';
  const c=body.querySelector("canvas").getContext("2d"),S=20;
  let s=[{x:10,y:10}],d={x:1,y:0},f={x:5,y:5};
  const key=e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];
    if(m&&!(m[0]===-d.x&&m[1]===-d.y)){d={x:m[0],y:m[1]};e.preventDefault()}};
  addEventListener("keydown",key);
  const t=setInterval(()=>{
    const h={x:(s[0].x+d.x+20)%20,y:(s[0].y+d.y+20)%20};
    if(s.some(p=>p.x===h.x&&p.y===h.y))s=[{x:10,y:10}];
    s.unshift(h);
    if(h.x===f.x&&h.y===f.y)f={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};else s.pop();
    c.fillStyle="#07070b";c.fillRect(0,0,400,400);
    c.fillStyle="#ff4d6d";c.fillRect(f.x*S,f.y*S,S-3,S-3);
    c.fillStyle="#7cf29a";s.forEach(p=>c.fillRect(p.x*S,p.y*S,S-3,S-3));
  },110);
  win.cleanup=()=>{clearInterval(t);removeEventListener("keydown",key)};
}

/* --- Tic Tac Toe --- */
function appTTT(body){
  let b=Array(9).fill(""),turn="X";
  const draw=()=>{
    const w=win3();
    body.innerHTML=`<div class="pad" style="text-align:center"><div>${w?w+" wins!":b.every(x=>x)?"Draw":"Turn: "+turn}</div><div class="gm">${b.map((v,i)=>`<div data-i="${i}">${v}</div>`).join("")}</div><button class="obtn" id="rs">Restart</button></div>`;
    body.querySelectorAll(".gm div").forEach(el=>el.onclick=()=>{const i=+el.dataset.i;if(b[i]||win3())return;b[i]=turn;turn=turn==="X"?"O":"X";draw()});
    body.querySelector("#rs").onclick=()=>{b=Array(9).fill("");turn="X";draw()};
  };
  const win3=()=>{for(const [x,y,z] of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]])if(b[x]&&b[x]===b[y]&&b[y]===b[z])return b[x];return ""};
  draw();
}

/* --- Calculator --- */
function appCalc(body){
  body.innerHTML='<div class="calc"><div class="disp">0</div></div>';
  const g=body.querySelector(".calc"),disp=g.querySelector(".disp");let ex="";
  "C ( ) / 7 8 9 * 4 5 6 - 1 2 3 + 0 . = ⌫".split(" ").forEach(k=>{
    const b=document.createElement("button");b.textContent=k;if("/*-+=".includes(k))b.className="op";
    b.onclick=()=>{
      if(k==="C")ex="";else if(k==="⌫")ex=ex.slice(0,-1);
      else if(k==="="){try{ex=String(Function('"use strict";return ('+ex.replace(/[^0-9+\-*/().]/g,"")+')')())}catch{ex="Error"}}
      else ex+=k;disp.textContent=ex||"0"};
    g.appendChild(b);
  });
}

/* --- Notes --- */
function appNotes(body){
  body.innerHTML='<div class="pad" style="height:100%"><textarea style="height:100%;resize:none" placeholder="Write something..."></textarea></div>';
  const t=body.querySelector("textarea");t.value=localStorage.getItem("os_notes")||"";t.oninput=()=>localStorage.setItem("os_notes",t.value);
}

/* --- Web / Games browser --- */
function appWeb(body){
  const saved=JSON.parse(localStorage.getItem("os_urls")||"[]");
  const HOME="https://www.google.com/webhp?igu=1";
  body.innerHTML=`<div style="display:flex;flex-direction:column;height:100%"><div class="pad" style="padding:8px;display:flex;gap:6px"><button class="obtn wh" type="button">⌂</button><input placeholder="Search Google or paste a URL"><button class="obtn wg" type="button">Go</button><button class="obtn wn" type="button" title="Open in a real tab">↗</button></div><div style="padding:0 10px 6px;font-size:12px;opacity:.7" id="sv"></div><div style="flex:1;min-height:0"><iframe></iframe></div></div>`;
  const inp=body.querySelector("input"),fr=body.querySelector("iframe"),sv=body.querySelector("#sv");
  let cur=HOME;
  const load=u=>{cur=u;fr.src=u};
  const go=v=>{
    v=v.trim();if(!v)return;
    let u;
    if(/^https?:\/\//i.test(v)){u=v;if(!saved.includes(u)){saved.push(u);localStorage.setItem("os_urls",JSON.stringify(saved));rl()}}
    else if(/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(v)){u="https://"+v}
    else u="https://www.google.com/search?igu=1&q="+encodeURIComponent(v);
    inp.value=u;load(u);
  };
  const rl=()=>{sv.innerHTML="";saved.forEach(u=>{const a=document.createElement("a");a.textContent=new URL(u).hostname;a.style.cssText="margin-right:10px;color:#9d8cff;cursor:pointer";a.onclick=()=>go(u);sv.appendChild(a)})};
  rl();load(HOME);
  body.querySelector(".wh").onclick=()=>{inp.value="";load(HOME)};
  body.querySelector(".wg").onclick=()=>go(inp.value);
  body.querySelector(".wn").onclick=()=>window.open(cur,"_blank");
  inp.addEventListener("keydown",e=>{e.stopPropagation();if(e.key==="Enter")go(inp.value)});
}

/* finds the game's own icon: <link rel=icon> / apple-touch-icon / og:image, else favicon.ico */
const iconCache={};
function findIcon(u){
  return iconCache[u]||(iconCache[u]=(async()=>{
    try{
      const r=await fetch(u);const h=await r.text();
      const d=new DOMParser().parseFromString(h,"text/html");
      const l=d.querySelector('link[rel~="icon"],link[rel="apple-touch-icon"],meta[property="og:image"]');
      const href=l&&(l.getAttribute("href")||l.getAttribute("content"));
      if(href)return new URL(href,u).href;
    }catch(_){}
    return new URL("favicon.ico",u).href;
  })());
}
function appGames(body,win){
  let prev=null;
  const big=()=>{if(!prev)prev={w:win.style.width,h:win.style.height,l:win.style.left,t:win.style.top};const w=Math.min(innerWidth-40,1200),h=Math.min(innerHeight-130,800);win.style.width=w+"px";win.style.height=h+"px";win.style.left=(innerWidth-w)/2+"px";win.style.top="40px"};
  const small=()=>{if(prev){win.style.width=prev.w;win.style.height=prev.h;win.style.left=prev.l;win.style.top=prev.t;prev=null}};
  const extra=JSON.parse(localStorage.getItem("os_games")||"[]");
  const all=()=>GAMES.concat(extra);
  function home(){
    small();
    body.innerHTML=`<div class="pad"><h3 style="margin:0 0 12px;font-family:'Fraunces',serif;font-weight:600">Games</h3><div class="ggrid"></div><div style="margin-top:16px;display:flex;gap:6px"><input class="gn" placeholder="Title" style="width:30%"><input class="gu" placeholder="https://..." ><button type="button" class="obtn ga">Add</button></div></div>`;
    const g=body.querySelector(".ggrid");
    all().forEach(x=>{
      const t=document.createElement("div");t.className="gtile";
      t.innerHTML=`<div class="gi" style="font-size:38px;height:48px;display:flex;align-items:center;justify-content:center">${x.icon||"🎮"}</div><div>${x.name}</div>`;
      findIcon(x.url).then(src=>{
        if(!src)return;
        const im=new Image();
        im.onload=()=>{const gi=t.querySelector(".gi");gi.textContent="";im.style.cssText="width:48px;height:48px;border-radius:10px;object-fit:cover";gi.appendChild(im)};
        im.src=src;
      });
      t.onclick=()=>play(x);g.appendChild(t);
    });
    const gn=body.querySelector(".gn"),gu=body.querySelector(".gu");
    [gn,gu].forEach(i=>i.addEventListener("keydown",e=>e.stopPropagation()));
    body.querySelector(".ga").onclick=()=>{
      const u=gu.value.trim(),n=gn.value.trim()||(/^https?:\/\//.test(u)?new URL(u).hostname:"");
      if(!/^https?:\/\//.test(u))return;
      extra.push({name:n,url:u});localStorage.setItem("os_games",JSON.stringify(extra));home();
    };
  }
  function play(x){
    big();
    body.innerHTML=`<div style="display:flex;flex-direction:column;height:100%"><div style="padding:6px 10px;display:flex;gap:8px;align-items:center;background:#17171f"><button type="button" class="obtn gb">← Games</button><b>${x.name}</b><button type="button" class="obtn gf" style="margin-left:auto" title="Fullscreen (best for keyboard/mouse games)">⛶</button><button type="button" class="obtn gx" title="Open in a real tab">↗</button></div><div style="flex:1;min-height:0"><iframe allowfullscreen allow="fullscreen; autoplay; gamepad; keyboard-map; clipboard-write"></iframe></div></div>`;
    const fr=body.querySelector("iframe");fr.tabIndex=0;fr.src=x.url;
    fr.addEventListener("load",()=>fr.focus());
    fr.addEventListener("mouseenter",()=>fr.focus());
    body.querySelector(".gf").onclick=()=>{(fr.requestFullscreen||fr.webkitRequestFullscreen).call(fr);setTimeout(()=>fr.focus(),200)};
    body.querySelector(".gb").onclick=home;
    body.querySelector(".gx").onclick=()=>window.open(x.url,"_blank");
  }
  home();
}
